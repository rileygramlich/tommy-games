name: Keep the game server awake for game night

# Render's free plan sleeps after 15 idle minutes, and waking takes up to a
# minute. Pinging every 10 minutes in the evening keeps it ready when the
# family is most likely to play, while staying well inside the free plan's
# 750 instance hours a month, which Scribist shares. Awake all day would not.
#
# The hours are UTC: 22:00–05:00 UTC is 4–11 pm in Calgary in summer
# (UTC−6) and 3–10 pm in winter (UTC−7). GitHub may start scheduled runs a
# few minutes late, and turns them off after 60 days without a commit.
on:
  schedule:
    - cron: "*/10 22,23,0,1,2,3,4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.GAME_SERVER_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping /health
        env:
          GAME_SERVER_URL: ${{ vars.GAME_SERVER_URL }}
        run: |
          url="${GAME_SERVER_URL/#wss:/https:}"
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors --max-time 90 "${url%/}/health"
