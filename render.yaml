# Render Blueprint for the online game server. The site itself is static and
# lives on GitHub Pages. Free plan: real WebSockets, but it sleeps after 15 idle
# minutes and its disk is wiped on restart, so accounts go to MongoDB.
# Render asks for the `sync: false` values when you create the Blueprint.
services:
  - type: web
    name: tommy-games
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      # Only the published site may connect. Origins have no path.
      - key: ALLOWED_ORIGINS
        value: https://rileygramlich.github.io
      # mongodb+srv://…/tommy-games — the database name goes after the host.
      - key: MONGODB_URI
        sync: false
      # Optional, both or neither: the OAuth client that turns on Sign in with
      # Google. Leave them blank and the button simply doesn't show. Its
      # redirect URI is this service's address + /auth/google/callback (Render
      # tells the server its own address in RENDER_EXTERNAL_URL).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
